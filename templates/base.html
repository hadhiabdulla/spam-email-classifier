<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpamShield - Spam Email Classifier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" id="mainNav">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('index') }}">
      <i class="fa-solid fa-shield-halved"></i> SpamShield
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='index' %}active{% endif %}" href="{{ url_for('index') }}">
            <i class="fa-solid fa-house me-1"></i>Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='history_page' %}active{% endif %}" href="{{ url_for('history_page') }}">
            <i class="fa-solid fa-clock-rotate-left me-1"></i>History
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='about' %}active{% endif %}" href="{{ url_for('about') }}">
            <i class="fa-solid fa-circle-info me-1"></i>About
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="container py-5">
    {% block content %}{% endblock %}
  </div>
</div>

<footer class="footer py-4">
  <div class="container text-center">
    <p class="mb-1 fw-semibold"><i class="fa-solid fa-shield-halved me-1"></i>SpamShield</p>
    <p class="mb-0 small text-muted">Spam Email Classifier &mdash; Mini Project &mdash; 2026</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
